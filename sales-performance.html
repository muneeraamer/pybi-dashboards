<style>
/* PyBI studio styles — Muhammad Rafay Shaikh, from Pakistan */
:root {
  --bg: #f3f2f1; --panel: #ffffff; --line: #e1dfdd; --text: #252423; --sub: #605e5c; --muted: #8a8886;
  --accent: #f2c811; --brand: #111827; --blue: #118dff; --blue2: #e8f3ff; --danger: #d64550; --ok: #1aab40;
  --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--text); font-size: 13px; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- top bars */
.titlebar { height: 38px; background: var(--brand); color: #fff; display: flex; align-items: center; padding: 0 12px; gap: 14px; }

.titlebar .right { display: flex; gap: 8px; align-items: center; font-size: 12px; opacity: .9; }

.ribbon { background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: stretch; padding: 4px 8px; gap: 2px; flex-wrap: wrap; min-height: 74px; }
.rgroup { display: flex; flex-direction: column; border-right: 1px solid var(--line); padding: 0 8px; }
.rgroup:last-child { border-right: 0; }
.rgroup .btns { display: flex; gap: 2px; flex: 1; align-items: center; }
.rgroup .glabel { font-size: 10.5px; color: var(--muted); text-align: center; padding-top: 2px; }
.rbtn { background: transparent; border: 1px solid transparent; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 3px 7px; min-width: 56px; font-size: 11.5px; color: var(--text); }
.rbtn:hover { background: #f3f2f1; border-color: var(--line); }

/* ---------- main layout */
.app { display: flex; flex-direction: column; height: 100vh; }

.ptable th { position: sticky; top: 0; background: inherit; text-align: left; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #c8c6c4; white-space: nowrap; cursor: pointer; background: var(--panel); z-index: 1; }
.canvas.dark .ptable th { background: #151b2e; }

/* slicers */
.slicer { height: 100%; overflow: auto; font-size: 12.5px; }

/* ---------- right panes */
.panes { display: flex; border-left: 1px solid var(--line); background: var(--panel); }

.chip { display: flex; align-items: center; gap: 4px; background: #f3f2f1; border-radius: 3px; padding: 3px 4px 3px 7px; font-size: 12px; cursor: grab; }

.fields .search { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 3px; margin: 2px 0 8px; }
.ftable { margin-bottom: 4px; }

.ftable > .tn .tmenu { margin-left: auto; opacity: 0; border: 0; background: transparent; }
.ftable > .tn:hover .tmenu { opacity: 1; }
.fitem { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 20px; border-radius: 3px; cursor: grab; white-space: nowrap; }
.fitem:hover { background: #f3f2f1; }
.fitem .ty { width: 16px; text-align: center; color: var(--sub); font-size: 11px; flex-shrink: 0; }
.fitem .ty.m { color: #c19c00; }

.fcard { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 6px; background: #faf9f8; }

/* ---------- data view / model view */
.dataview { flex: 1; display: flex; min-height: 0; background: var(--panel); }

/* ---------- dialogs */

.modal input[type=text], .modal input[type=number], .modal select, .modal textarea { width: 100%; padding: 6px 8px; border: 1px solid #c8c6c4; border-radius: 4px; }

.getdata { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.getdata button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.getdata button:hover { border-color: var(--blue); background: var(--blue2); }
.getdata button .ic { font-size: 26px; }
.drop-zone { border: 2px dashed #c8c6c4; border-radius: 8px; padding: 28px; text-align: center; color: var(--sub); margin-top: 12px; }
.drop-zone.over { border-color: var(--blue); background: var(--blue2); }
.fnref { display: flex; gap: 10px; }
.fnref .side { width: 230px; max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; padding: 6px; font-size: 12px; }
.fnref .side div { padding: 2px 4px; cursor: pointer; border-radius: 3px; }
.fnref .side div:hover { background: var(--blue2); }
.fnref .side .g { font-weight: 700; color: var(--sub); cursor: default; margin-top: 6px; }
.fnref .side .g:hover { background: transparent; }

/* query editor */
.qe { display: flex; height: 100%; gap: 0; }
.qe .ql { width: 210px; border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
.qe .ql .q { padding: 6px 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
.qe .ql .q.on { background: var(--blue2); font-weight: 600; }
.qe .qm { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.qe .qtool { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
.qe .qtool button { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.qe .qtool button:hover { background: var(--blue2); border-color: var(--blue); }
.qe .qgrid { flex: 1; overflow: auto; }
.qe .qgrid table { border-collapse: collapse; font-size: 12px; }
.qe .qgrid th { position: sticky; top: 0; background: #f3f2f1; border: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; cursor: pointer; vertical-align: top; }
.qe .qgrid th.sel { background: #cfe6ff; }
.qe .qgrid th .ty { color: var(--blue); font-weight: 700; margin-right: 4px; }
.qe .qgrid th .q { display: block; height: 3px; background: linear-gradient(90deg, var(--ok) var(--v), #d64550 var(--v)); margin-top: 4px; border-radius: 2px; }
.qe .qgrid th small { color: var(--muted); font-weight: 400; display: block; }
.qe .qgrid td { border: 1px solid #f0efee; padding: 3px 8px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.qe .qgrid td.null { color: var(--muted); font-style: italic; }
.qe .qr { width: 250px; border-left: 1px solid var(--line); padding: 8px; overflow: auto; }
.qe .qr .step { padding: 5px 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 12.5px; }
.qe .qr .step.on { background: var(--blue2); }
.qe .qr .step button { border: 0; background: transparent; color: var(--danger); }
.qe .qstatus { padding: 5px 10px; border-top: 1px solid var(--line); color: var(--sub); font-size: 12px; display: flex; justify-content: space-between; }
.qe .qerr { color: var(--danger); padding: 8px; }

/* menus & toasts */
.menu { position: fixed; z-index: 30000; background: #fff; border: 1px solid #c8c6c4; box-shadow: 0 6px 20px rgba(0,0,0,.18); border-radius: 4px; padding: 4px 0; min-width: 180px; }
.menu div { padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.menu div:hover { background: #f3f2f1; }
.menu div.sep { height: 1px; background: var(--line); padding: 0; margin: 4px 0; }
.menu div.on::before { content: "✓ "; }
.toast { position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%); background: #252423; color: #fff; padding: 9px 16px; border-radius: 6px; z-index: 40000; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 80vw; }
.toast.err { background: var(--danger); }
.busy { position: fixed; inset: 0; z-index: 50000; background: rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.busy span { background: #fff; padding: 14px 20px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.welcome { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; }
.welcome .card { background: #fff; padding: 30px 34px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.15); text-align: center; max-width: 560px; }
.welcome h1 { margin: 0 0 6px; font-size: 26px; }
.welcome p { color: var(--sub); }
.welcome .acts { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.welcome .acts .btn { padding: 9px 16px; }
.credit { color: var(--muted); font-size: 11.5px; margin-top: 16px; }
.share-url { display: flex; gap: 6px; margin: 8px 0; }
.share-url input { flex: 1; font-family: Consolas, monospace; }

/* ---------- focus overlay */
.focus-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 25000; display: flex; align-items: center; justify-content: center; }
.focus-box { width: 92vw; height: 86vh; background: #fff; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }

.focus-head button { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 4px 10px; }
.focus-body { flex: 1; padding: 10px; position: relative; overflow: hidden; }

body.viewer-mode { background: #e9e8e6; }
.vbar { position: sticky; top: 0; z-index: 100; background: var(--brand); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 14px; height: 46px; }

.vactions { display: flex; gap: 6px; align-items: center; }

.vstage { padding: 12px 12px 0; overflow-x: hidden; }

.vfoot { text-align: center; color: var(--muted); font-size: 11.5px; padding: 8px 0 14px; }

  function fmtValue(v, fmt, compact) {
    if (isBlank(v)) return "(Blank)";
    if (typeof v === "boolean") return v ? "True" : "False";
    if (typeof v !== "number") {
      if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}T00:00:00$/.test(v)) return v.slice(0, 10);
      if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}T/.test(v)) return v.replace("T", " ");
      return String(v);
    }
    if (fmt === undefined && Number.isInteger(v)) return String(v);
    fmt = fmt || {};
    const type = fmt.type || "auto";
    let dec = fmt.decimals;
    if (type === "percent") {
      return (v * 100).toLocaleString(undefined, { minimumFractionDigits: dec ?? 1, maximumFractionDigits: dec ?? 1 }) + "%";
    }
    let prefix = type === "currency" ? (fmt.symbol ?? "$") : "";
    let suffix = "";
    let n = v;
    if (compact || fmt.units) {
      const a = Math.abs(v);
      const unit = fmt.units && fmt.units !== "auto" ? fmt.units : (a >= 1e9 ? "bn" : a >= 1e6 ? "M" : a >= 1e3 ? "K" : "");
      if (unit === "bn") { n = v / 1e9; suffix = "bn"; }
      else if (unit === "M") { n = v / 1e6; suffix = "M"; }
      else if (unit === "K") { n = v / 1e3; suffix = "K"; }
      if (suffix && dec === undefined) dec = Math.abs(n) >= 100 ? 0 : Math.abs(n) >= 10 ? 1 : 2;
    }
    if (dec === undefined) dec = type === "whole" ? 0 : (Number.isInteger(n) ? 0 : (Math.abs(n) >= 1000 ? 0 : 2));
    const sign = n < 0 ? "-" : "";
    return sign + prefix + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suffix;
  }

  // ------------------------------------------------------------------ DAX tokenizer & parser
  function tokenize(src) {
    const toks = [];
    let i = 0;
    const n = src.length;
    while (i < n) {
      const ch = src[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === "/" && src[i + 1] === "/") { while (i < n && src[i] !== "\n") i++; continue; }
      if (ch === "-" && src[i + 1] === "-") { while (i < n && src[i] !== "\n") i++; continue; }
      if (ch === "/" && src[i + 1] === "*") { const e = src.indexOf("*/", i + 2); i = e < 0 ? n : e + 2; continue; }
      if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(src[i + 1] || ""))) {
        let j = i; while (j < n && /[0-9.eE]/.test(src[j])) j++;
        toks.push({ t: "num", v: parseFloat(src.slice(i, j)) }); i = j; continue;
      }
      if (ch === '"') {
        let j = i + 1, s = "";
        while (j < n) { if (src[j] === '"') { if (src[j + 1] === '"') { s += '"'; j += 2; continue; } break; } s += src[j++]; }
        toks.push({ t: "str", v: s }); i = j + 1; continue;
      }
      if (ch === "'" || /[A-Za-z_]/.test(ch)) {
        let name, j;
        if (ch === "'") { j = src.indexOf("'", i + 1); if (j < 0) throw new Error("Unclosed quote"); name = src.slice(i + 1, j); j++; }
        else { j = i; while (j < n && /[A-Za-z0-9_.]/.test(src[j])) j++; name = src.slice(i, j); }
        let k = j; while (k < n && src[k] === " ") k++;
        if (src[k] === "[") {
          const e = src.indexOf("]", k); if (e < 0) throw new Error("Unclosed [");
          toks.push({ t: "col", table: name, column: src.slice(k + 1, e) }); i = e + 1; continue;
        }
        toks.push({ t: ch === "'" ? "tbl" : "id", v: name }); i = j; continue;
      }
      if (ch === "[") { const e = src.indexOf("]", i); if (e < 0) throw new Error("Unclosed ["); toks.push({ t: "mref", v: src.slice(i + 1, e) }); i = e + 1; continue; }
      const two = src.slice(i, i + 2);
      if (["<>", "<=", ">=", "&&", "||", "=="].includes(two)) { toks.push({ t: "op", v: two === "==" ? "=" : two }); i += 2; continue; }
      if ("+-*/^&=<>(),{}".includes(ch)) { toks.push({ t: "op", v: ch }); i++; continue; }
      throw new Error("Unexpected character '" + ch + "'");
    }
    return toks;
  }

  function parse(src) {
    const toks = tokenize(src);
    let p = 0;
    const peek = () => toks[p];
    const isOp = (v) => toks[p] && toks[p].t === "op" && toks[p].v === v;
    const isKw = (v) => toks[p] && toks[p].t === "id" && toks[p].v.toUpperCase() === v;
    const expect = (v) => { if (!isOp(v)) throw new Error("Expected '" + v + "'" + (peek() ? " near '" + (peek().v ?? peek().column) + "'" : " at end")); p++; };

    function expr() {
      if (isKw("VAR")) {
        const vars = [];
        while (isKw("VAR")) {
          p++;
          const name = toks[p++];
          if (!name || name.t !== "id") throw new Error("Expected variable name after VAR");
          expect("=");
          vars.push([name.v, expr()]);
        }
        if (!isKw("RETURN")) throw new Error("Expected RETURN");
        p++;
        return { k: "let", vars, body: expr() };
      }
      return or();
    }
    function or() { let l = and(); while (isOp("||")) { p++; l = { k: "bin", op: "||", l, r: and() }; } return l; }
    function and() { let l = cmp(); while (isOp("&&")) { p++; l = { k: "bin", op: "&&", l, r: cmp() }; } return l; }
    function cmp() {
      let l = concat();
      const t = peek();
      if (t && t.t === "op" && ["=", "<>", "<", ">", "<=", ">="].includes(t.v)) { p++; return { k: "bin", op: t.v, l, r: concat() }; }
      if (isKw("IN")) { p++; return { k: "in", l, r: primary() }; }
      return l;
    }
    function concat() { let l = add(); while (isOp("&")) { p++; l = { k: "bin", op: "&", l, r: add() }; } return l; }
    function add() { let l = mul(); while (isOp("+") || isOp("-")) { const op = toks[p++].v; l = { k: "bin", op, l, r: mul() }; } return l; }
    function mul() { let l = pow(); while (isOp("*") || isOp("/")) { const op = toks[p++].v; l = { k: "bin", op, l, r: pow() }; } return l; }
    function pow() { let l = unary(); while (isOp("^")) { p++; l = { k: "bin", op: "^", l, r: unary() }; } return l; }
    function unary() {
      if (isOp("-")) { p++; return { k: "neg", e: unary() }; }
      if (isOp("+")) { p++; return unary(); }
      return primary();
    }
    function primary() {
      const t = toks[p];
      if (!t) throw new Error("Unexpected end of formula");
      if (t.t === "num") { p++; return { k: "num", v: t.v }; }
      if (t.t === "str") { p++; return { k: "str", v: t.v }; }
      if (t.t === "col") { p++; return { k: "col", t: t.table, c: t.column }; }
      if (t.t === "mref") { p++; return { k: "mref", n: t.v }; }
      if (t.t === "tbl") { p++; return { k: "table", n: t.v }; }
      if (isOp("(")) { p++; const e = expr(); expect(")"); return e; }
      if (isOp("{")) {
        p++; const items = [];
        if (!isOp("}")) { items.push(expr()); while (isOp(",")) { p++; items.push(expr()); } }
        expect("}"); return { k: "list", items };
      }
      if (t.t === "id") {
        p++;
        if (isOp("(")) {
          p++; const args = [];
          if (!isOp(")")) { args.push(isOp(",") ? { k: "blank" } : expr()); while (isOp(",")) { p++; args.push(isOp(")") ? { k: "blank" } : expr()); } }
          expect(")");
          return { k: "fn", n: t.v.toUpperCase(), args };
        }
        const up = t.v.toUpperCase();
        if (up === "TRUE") return { k: "bool", v: true };
        if (up === "FALSE") return { k: "bool", v: false };
        if (["YEAR", "MONTH", "DAY", "QUARTER"].includes(up)) return { k: "str", v: up };
        return { k: "name", n: t.v };
      }
      throw new Error("Unexpected '" + (t.v ?? "") + "'");
    }
    const ast = expr();
    if (p < toks.length) throw new Error("Unexpected '" + (toks[p].v ?? toks[p].column) + "' after end of formula");
    return ast;
  }

  // ------------------------------------------------------------------ filter objects
  let FID = 0;
  function colKey(t, c, level) { return t + "[" + c + "]" + (level ? "." + level : ""); }
  function inFilter(t, c, values, level, extra) {
    const set = values instanceof Set ? values : new Set(values);
    const key = "in:" + colKey(t, c, level) + "=" + JSON.stringify(Array.from(set).slice(0, 2000));
    return Object.assign({ t, c, level: level || null, kind: "in", values: set, key }, extra || {});
  }
  function predFilter(t, c, fn, level, label) {
    return { t, c, level: level || null, kind: "pred", pred: fn, key: "pred:" + (label ? colKey(t, c, level) + label : ++FID) };
  }

  // ------------------------------------------------------------------ the model
  class Model {
    constructor(spec) {
      this.tables = {};
      this.relationships = (spec.relationships || []).filter((r) => r.active !== false);
      this.measures = {};
      this.measureList = spec.measures || [];
      this.columnProps = spec.columnProps || {};
      this.errors = {};
      for (const [name, t] of Object.entries(spec.tables || {})) {
        this.tables[name] = { name, columns: t.columns.map((c) => Object.assign({}, c)), data: Object.assign({}, t.data), rows: t.rows };
      }
      this._idx = {};
      this._paths = {};
      this._derived = {};
      this._rowsCache = new Map();
      this._calcCols = spec.calcColumns || [];
      for (const cc of this._calcCols) this._addCalcColumn(cc);
      for (const m of this.measureList) {
        try { this.measures[m.name] = Object.assign({}, m, { ast: parse(m.expression) }); }
        catch (e) { this.errors["measure:" + m.name] = e.message; this.measures[m.name] = Object.assign({}, m, { ast: null, error: e.message }); }
      }
    }

    _addCalcColumn(cc) {
      const T = this.tables[cc.table];
      if (!T) { this.errors["column:" + cc.table + "[" + cc.name + "]"] = "Table not found"; return; }
      let ast;
      try { ast = parse(cc.expression); } catch (e) { this.errors["column:" + cc.table + "[" + cc.name + "]"] = e.message; return; }
      const out = new Array(T.rows);
      let err = null;
      for (let i = 0; i < T.rows; i++) {
        try { out[i] = this.eval(ast, { filters: [], row: { table: cc.table, i }, vars: {} }); }
        catch (e) { err = e.message; out[i] = null; if (i > 5) break; }
      }
      if (err) this.errors["column:" + cc.table + "[" + cc.name + "]"] = err;
      let type = "text";
      const sample = out.find((v) => !isBlank(v));
      if (typeof sample === "number") type = "number";
      else if (typeof sample === "boolean") type = "bool";
      else if (typeof sample === "string" && /^\d{4}-\d{2}-\d{2}T/.test(sample)) type = "date";
      T.data[cc.name] = out;
      const existing = T.columns.find((c) => c.name === cc.name);
      if (existing) Object.assign(existing, { type, calc: true });
      else T.columns.push({ name: cc.name, type, calc: true, expression: cc.expression });
      this._rowsCache.clear(); this._derived = {};
    }

    column(t, c) {
      const T = this.tables[t];
      if (!T) throw new Error("Unknown table '" + t + "'");
      const d = T.data[c];
      if (!d) throw new Error("Column '" + c + "' not found in table '" + t + "'");
      return d;
    }
    colType(t, c) { const T = this.tables[t]; const col = T && T.columns.find((x) => x.name === c); return col ? col.type : "text"; }
    derived(t, c, level) {
      if (!level) return this.column(t, c);
      const k = colKey(t, c, level);
      if (!this._derived[k]) this._derived[k] = this.column(t, c).map((v) => applyLevel(v, level));
      return this._derived[k];
    }

    // index on the "one" side of a relationship
    index(t, c) {
      const k = t + "[" + c + "]";
      if (!this._idx[k]) {
        const m = new Map(); const col = this.column(t, c);
        for (let i = 0; i < col.length; i++) if (!m.has(col[i])) m.set(col[i], i);
        this._idx[k] = m;
      }
      return this._idx[k];
    }

    /** row map from table `from` to table `to` following many-to-one relationships. Returns Int32Array or null. */
    path(from, to) {
      if (from === to) return null;
      const k = from + "->" + to;
      if (k in this._paths) return this._paths[k];
      const queue = [[from, []]]; const seen = new Set([from]); let found = null;
      while (queue.length && !found) {
        const [cur, hops] = queue.shift();
        for (const r of this.relationships) {
          if (r.fromTable === cur && !seen.has(r.toTable)) {
            const h = hops.concat([r]);
            if (r.toTable === to) { found = h; break; }
            seen.add(r.toTable); queue.push([r.toTable, h]);
          }
        }
      }
      let map = null;
      if (found) {
        const n = this.tables[from].rows; map = new Int32Array(n);
        for (let i = 0; i < n; i++) map[i] = i;
        let curT = from;
        for (const r of found) {
          const key = this.column(curT, r.fromColumn); const idx = this.index(r.toTable, r.toColumn);
          for (let i = 0; i < n; i++) { const ri = map[i]; if (ri < 0) continue; const j = idx.get(key[ri]); map[i] = j === undefined ? -1 : j; }
          curT = r.toTable;
        }
        map.hops = found;
      }
      this._paths[k] = map;
      return map;
    }

    /** value getter for column ref (t,c,level) evaluated on rows of table T. */
    getter(T, t, c, level) {
      const vals = this.derived(t, c, level);
      if (T === t) return (i) => vals[i];
      const map = this.path(T, t);
      if (!map) return null;
      return (i) => (map[i] < 0 ? null : vals[map[i]]);
    }

    _testFilter(T, f) {
      // returns predicate on row index of T, or null if the filter does not reach T
      const ok = f.kind === "in" ? (v) => f.values.has(v) : f.kind === "pred" ? f.pred : null;
      if (f.kind === "rows") {
        if (f.t === T) return (i) => f.rows.has(i);
        const map = this.path(T, f.t);
        if (map) return (i) => map[i] >= 0 && f.rows.has(map[i]);
        return this._bothDirection(T, f);
      }
      if (f.t === T) { const vals = this.derived(f.t, f.c, f.level); return (i) => ok(vals[i]); }
      const g = this.getter(T, f.t, f.c, f.level);
      if (g) return (i) => ok(g(i));
      return this._bothDirection(T, f);
    }

    _bothDirection(T, f) {
      // filter on a many-side table reaching a one-side table T through bi-directional relationships
      const map = this.path(f.t, T);
      if (!map || !map.hops.every((r) => r.crossFilter === "both")) return null;
      const rows = this.rowsFor(f.t, [f]);
      const allowed = new Set();
      for (const r of rows) if (map[r] >= 0) allowed.add(map[r]);
      return (i) => allowed.has(i);
    }

    rowsFor(T, filters) {
      const key = T + "|" + filters.map((f) => f.key).join(";");
      const hit = this._rowsCache.get(key);
      if (hit) return hit;
      let rows;
      if (!filters.length) {
        const n = this.tables[T].rows; rows = new Int32Array(n); for (let i = 0; i < n; i++) rows[i] = i;
      } else {
        const prev = this.rowsFor(T, filters.slice(0, -1));
        const test = this._testFilter(T, filters[filters.length - 1]);
        if (!test) rows = prev;
        else { const out = []; for (let k = 0; k < prev.length; k++) if (test(prev[k])) out.push(prev[k]); rows = Int32Array.from(out); }
      }
      if (this._rowsCache.size > 6000) this._rowsCache.clear();
      this._rowsCache.set(key, rows);
      return rows;
    }

    distinct(t, c, level, filters) {
      const rows = this.rowsFor(t, filters || []);
      const vals = this.derived(t, c, level); const s = new Set();
      for (const i of rows) s.add(vals[i]);
      return Array.from(s);
    }

    sortValues(t, c, level, values) {
      const props = this.columnProps[t + "[" + c + "]"] || {};
      if (props.sortBy && !level && this.tables[t].data[props.sortBy]) {
        const src = this.column(t, c), by = this.column(t, props.sortBy); const m = new Map();
        for (let i = 0; i < src.length; i++) if (!m.has(src[i])) m.set(src[i], by[i]);
        return values.slice().sort((a, b) => compareValues(m.get(a), m.get(b)));
      }
      return values.slice().sort(compareValues);
    }

    // -------------------------------------------------------------- evaluation
    measureValue(name, filters) {
      const m = this.measures[name];
      if (!m) throw new Error("Unknown measure [" + name + "]");
      if (!m.ast) throw new Error(m.error || "Invalid measure");
      return this.eval(m.ast, { filters, row: null, vars: {} });
    }

    evalExpr(src, filters) { return this.eval(typeof src === "string" ? parse(src) : src, { filters: filters || [], row: null, vars: {} }); }

    eval(n, ctx) {
      switch (n.k) {
        case "num": case "str": case "bool": return n.v;
        case "blank": return null;
        case "neg": { const v = this.eval(n.e, ctx); return isBlank(v) ? null : -v; }
        case "list": return n.items.map((x) => this.eval(x, ctx));
        case "let": {
          const vars = Object.assign({}, ctx.vars);
          const c2 = Object.assign({}, ctx, { vars });
          for (const [name, e] of n.vars) vars[name] = { value: this.eval(e, c2), ast: e };
          return this.eval(n.body, c2);
        }
        case "name": {
          if (ctx.vars && n.n in ctx.vars) return ctx.vars[n.n].value;
          throw new Error("Unknown name '" + n.n + "'");
        }
        case "in": {
          const v = this.eval(n.l, ctx); const list = this.eval(n.r, ctx);
          return Array.isArray(list) && list.some((x) => x === v || String(x) === String(v));
        }
        case "col": return this._colValue(n.t, n.c, ctx);
        case "mref": {
          if (this.measures[n.n]) {
            const filters = ctx.row ? this._contextTransition(ctx) : ctx.filters;
            return this.measureValue(n.n, filters);
          }
          if (ctx.row && this.tables[ctx.row.table].data[n.n]) return this.tables[ctx.row.table].data[n.n][ctx.row.i];
          if (ctx.colRow) { for (const k in ctx.colRow) if (k.endsWith("[" + n.n + "]")) return ctx.colRow[k]; }
          throw new Error("Unknown measure or column [" + n.n + "]");
        }
        case "bin": return this._bin(n, ctx);
        case "fn": return this._fn(n, ctx);
        case "table": throw new Error("Table '" + n.n + "' used where a value was expected");
      }
      throw new Error("Cannot evaluate node " + n.k);
    }

    _contextTransition(ctx) {
      // row context -> filter context (used when a measure is referenced inside an iterator / calc column)
      if (!ctx.row) return ctx.filters;
      if (ctx.row.colFilters) return ctx.filters.filter((f) => !ctx.row.colFilters.some((g) => g.t === f.t && g.c === f.c)).concat(ctx.row.colFilters);
      return ctx.filters.concat([{ t: ctx.row.table, kind: "rows", rows: new Set([ctx.row.i]), key: "row:" + ctx.row.table + ":" + ctx.row.i }]);
    }

    _colValue(t, c, ctx) {
      if (ctx.colRow && (t + "[" + c + "]") in ctx.colRow) return ctx.colRow[t + "[" + c + "]"];
      if (!ctx.row) throw new Error("Column " + t + "[" + c + "] needs an aggregation (e.g. SUM) in a measure");
      if (ctx.row.table === t) return this.column(t, c)[ctx.row.i];
      const g = this.getter(ctx.row.table, t, c);
      if (g) return g(ctx.row.i);
      throw new Error("No relationship from '" + ctx.row.table + "' to '" + t + "'");
    }

    _bin(n, ctx) {
      if (n.op === "&&") return !!this.eval(n.l, ctx) && !!this.eval(n.r, ctx);
      if (n.op === "||") return !!this.eval(n.l, ctx) || !!this.eval(n.r, ctx);
      const a = this.eval(n.l, ctx), b = this.eval(n.r, ctx);
      switch (n.op) {
        case "&": return (isBlank(a) ? "" : String(a)) + (isBlank(b) ? "" : String(b));
        case "+": return isBlank(a) && isBlank(b) ? null : (a || 0) + (b || 0);
        case "-": return isBlank(a) && isBlank(b) ? null : (a || 0) - (b || 0);
        case "*": return isBlank(a) || isBlank(b) ? null : a * b;
        case "/": if (isBlank(a)) return null; if (!b) throw new Error("Division by zero (use DIVIDE)"); return a / b;
        case "^": return isBlank(a) ? null : Math.pow(a, b || 0);
        case "=": return (isBlank(a) && isBlank(b)) || a === b || (!isBlank(a) && !isBlank(b) && String(a) === String(b));
        case "<>": return !((isBlank(a) && isBlank(b)) || a === b || String(a) === String(b));
        case "<": return compareValues(a ?? 0, b ?? 0) < 0;
        case ">": return compareValues(a ?? 0, b ?? 0) > 0;
        case "<=": return compareValues(a ?? 0, b ?? 0) <= 0;
        case ">=": return compareValues(a ?? 0, b ?? 0) >= 0;
      }
      throw new Error("Unknown operator " + n.op);
    }

    // ---- table expressions: returns {t, rows, cols?} or column-table {t, c, values}
    evalTable(n, ctx) {
      if (n.k === "table" || n.k === "name") {
        if (n.k === "name" && ctx.vars && n.n in ctx.vars && ctx.vars[n.n].value && ctx.vars[n.n].value.__table) return ctx.vars[n.n].value;
        if (!this.tables[n.n]) throw new Error("Unknown table '" + n.n + "'");
        return { __table: true, t: n.n, rows: Array.from(this.rowsFor(n.n, ctx.filters)) };
      }
      if (n.k === "fn") {
        const a = n.args;
        switch (n.n) {
          case "ALL": case "REMOVEFILTERS": case "ALLNOBLANKROW":
            if (a[0].k === "col") return { __table: true, t: a[0].t, c: a[0].c, values: this.distinct(a[0].t, a[0].c, null, []) };
            return { __table: true, t: this._tname(a[0]), rows: Array.from(this.rowsFor(this._tname(a[0]), [])) };
          case "ALLSELECTED":
            if (a[0] && a[0].k === "col") return { __table: true, t: a[0].t, c: a[0].c, values: this.distinct(a[0].t, a[0].c, null, ctx.filters.filter((f) => !f.group)) };

  const icon = (t) => '<svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">' + (ICONS[t] || "") + "</svg>";

  // ------------------------------------------------------------ tooltip
  let tip;
  function tooltip() {
    if (!tip) { tip = document.createElement("div"); tip.className = "pybi-tip"; document.body.appendChild(tip); }
    return tip;
  }
  function showTip(ev, rows) {
    const t = tooltip();

    const x = ev.clientX + 14, y = ev.clientY + 12;

  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ------------------------------------------------------------ helpers

  function catText(c) { return fmtV(c); }
  function truncate(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  function makeSvg(el, w, h) {

  }

  function legend(svg, items, x, y, w, theme, orient) {
    const g = svg.append("g").attr("class", "legend").attr("transform", "translate(" + x + "," + y + ")");
    let cx = 0, cy = 0;
    items.forEach((it) => {
      const label = truncate(it.name, 28);
      const lw = 16 + measureText(label, 11) + 12;
      if (orient !== "vertical" && cx + lw > w && cx > 0) { cx = 0; cy += 16; }
      const gi = g.append("g").attr("transform", "translate(" + cx + "," + cy + ")");
      gi.append("circle").attr("cx", 5).attr("cy", 6).attr("r", 5).attr("fill", it.color);
      gi.append("text").attr("x", 14).attr("y", 10).attr("font-size", 11).attr("fill", theme.sub).text(label);
      if (orient === "vertical") cy += 17; else cx += lw;
    });
    return orient === "vertical" ? cy : cy + 18;
  }

  function axisStyle(g, theme) {
    g.selectAll("text").attr("fill", theme.sub).attr("font-size", 11);
    g.selectAll("line").attr("stroke", theme.grid);
    g.select(".domain").attr("stroke", theme.grid);
  }

  function selectedOpacity(sel, value) { return !sel || !sel.size || sel.has(value) ? 1 : 0.3; }

  // ------------------------------------------------------------ category charts
  function renderCategory(el, v, r, o) {
    const theme = o.theme, f = v.format || {}, W = o.width, H = o.height;
    const horizontal = ["clusteredBar", "stackedBar"].includes(v.type);
    const stacked = ["stackedColumn", "stackedBar", "percentColumn", "stackedArea"].includes(v.type);
    const percent = v.type === "percentColumn";
    const isLine = ["line", "area", "stackedArea"].includes(v.type);
    const series = r.series.slice();
    const lines = (r.lines || []).slice();
    const all = series.concat(lines);
    const colors = colorsFor(v, theme, all.length);
    all.forEach((s, i) => (s.color = colors[i]));
    const svg = makeSvg(el, W, H);
    const showLegend = f.legend !== false && (all.length > 1 || r.legendField);
    let top = 6;
    if (showLegend) top += legend(svg, all.map((s) => ({ name: s.name, color: s.color })), 8, 4, W - 16, theme);
    const cats = r.categories;
    const n = cats.length;
    // values
    let data = cats.map((c, i) => {
      const row = { c, i };
      series.forEach((s, j) => (row[j] = s.values[i] || 0));
      return row;
    });
    if (percent) data.forEach((row) => { const t = series.reduce((a, _, j) => a + Math.abs(row[j]), 0) || 1; series.forEach((_, j) => (row[j] = row[j] / t)); });
    let maxV, minV;
    if (stacked) {
      maxV = d3.max(data, (row) => series.reduce((a, _, j) => a + Math.max(0, row[j]), 0)) || 0;
      minV = d3.min(data, (row) => series.reduce((a, _, j) => a + Math.min(0, row[j]), 0)) || 0;
    } else {
      maxV = d3.max(series, (s) => d3.max(s.values, (x) => x || 0)) || 0;
      minV = Math.min(0, d3.min(series, (s) => d3.min(s.values, (x) => x || 0)) || 0);
    }
    const yfmt = percent ? { type: "percent", decimals: 0 } : (series[0] && series[0].fmt) || {};
    const longest = d3.max(cats, (c) => truncate(catText(c), 18).length) || 4;
    const valW = Math.max(30, measureText(fmtV(maxV, yfmt, true), 11) + 10);
    const m = horizontal
      ? { l: Math.min(150, longest * 6.4 + 14), r: 16, t: top + 6, b: f.axisTitles === false ? 22 : 34 }
      : { l: f.axisTitles === false ? valW : valW + 14, r: lines.length ? 50 : 14, t: top + 8, b: 0 };
    // x-axis label rotation for columns
    let rotate = false;
    if (!horizontal) {
      const slot = (W - m.l - m.r) / Math.max(n, 1);
      rotate = longest * 6.2 > slot && n > 3;
      m.b = (rotate ? Math.min(80, longest * 5 + 18) : 26) + (f.axisTitles === false ? 0 : 14);
    }
    const iw = Math.max(10, W - m.l - m.r), ih = Math.max(10, H - m.t - m.b);
    const g = svg.append("g").attr("transform", "translate(" + m.l + "," + m.t + ")");
    const band = d3.scaleBand().domain(d3.range(n)).range(horizontal ? [0, ih] : [0, iw]).padding(isLine ? 0 : 0.22);
    const point = d3.scalePoint().domain(d3.range(n)).range([0, iw]).padding(0.3);
    const lin = d3.scaleLinear().domain([minV, maxV === minV ? minV + 1 : maxV]).nice().range(horizontal ? [0, iw] : [ih, 0]);
    // grid & axes
    if (f.gridlines !== false) {
      const ticks = lin.ticks(horizontal ? Math.max(2, Math.floor(iw / 90)) : Math.max(2, Math.floor(ih / 40)));
      g.append("g").selectAll("line").data(ticks).join("line")
        .attr("x1", horizontal ? (d) => lin(d) : 0).attr("x2", horizontal ? (d) => lin(d) : iw)
        .attr("y1", horizontal ? 0 : (d) => lin(d)).attr("y2", horizontal ? ih : (d) => lin(d))
        .attr("stroke", theme.grid).attr("stroke-dasharray", "2,3");
    }
    const tickFmt = (d) => fmtV(d, yfmt, true);
    const catLabel = (i) => truncate(catText(cats[i]), rotate ? 16 : 18);
    if (horizontal) {
      axisStyle(g.append("g").call(d3.axisLeft(band).tickFormat(catLabel).tickSize(0).tickPadding(6)), theme);
      axisStyle(g.append("g").attr("transform", "translate(0," + ih + ")").call(d3.axisBottom(lin).ticks(Math.max(2, Math.floor(iw / 90))).tickFormat(tickFmt).tickSize(0).tickPadding(6)), theme);
    } else {
      const xs = isLine ? point : band;
      const every = Math.ceil(n / Math.max(1, Math.floor(iw / (rotate ? 22 : 40))));
      const xa = g.append("g").attr("transform", "translate(0," + ih + ")").call(d3.axisBottom(xs).tickFormat((i) => (i % every === 0 ? catLabel(i) : "")).tickSize(0).tickPadding(7));
      axisStyle(xa, theme);
      if (rotate) xa.selectAll("text").attr("transform", "rotate(-40)").attr("text-anchor", "end").attr("dx", "-0.3em").attr("dy", "0.4em");
      axisStyle(g.append("g").call(d3.axisLeft(lin).ticks(Math.max(2, Math.floor(ih / 40))).tickFormat(tickFmt).tickSize(0).tickPadding(6)), theme);
    }
    g.selectAll(".domain").attr("stroke", "none");
    if (f.axisTitles !== false) {
      const ct = r.catLabel || "", vt = series.length === 1 && !r.legendField ? series[0].name : "";
      if (horizontal) {
        if (vt) g.append("text").attr("x", iw / 2).attr("y", ih + 30).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", theme.sub).text(truncate(vt, 40));
      } else {
        g.append("text").attr("x", iw / 2).attr("y", ih + m.b - 4).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", theme.sub).text(truncate(ct, 50));
        if (vt) g.append("text").attr("transform", "rotate(-90)").attr("x", -ih / 2).attr("y", -m.l + 11).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", theme.sub).text(truncate(vt, 40));
      }
    }
    const sel = o.selection;
    const tipRows = (i, highlight) => [[r.catLabel || "Category", catText(cats[i])]].concat(all.map((s) => [s.name, fmtV(s.values[i], s.fmt), s.color]));
    const click = (ev, i) => { ev.stopPropagation(); if (o.onSelect && r.catField) o.onSelect(cats[i], ev.ctrlKey || ev.metaKey); };
    const labelsOn = f.dataLabels;

    if (!isLine) {
      const sub = d3.scaleBand().domain(d3.range(series.length)).range([0, band.bandwidth()]).padding(0.06);
      series.forEach((s, j) => {
        const rects = g.append("g").selectAll("rect").data(data).join("rect")
          .attr("fill", s.color).attr("rx", f.rounded === false ? 0 : 2)
          .attr("opacity", (d) => selectedOpacity(sel, cats[d.i])).style("cursor", r.catField ? "pointer" : "default")
          .on("mousemove", (ev, d) => showTip(ev, tipRows(d.i))).on("mouseleave", hideTip).on("click", (ev, d) => click(ev, d.i));
        const base = (d) => (stacked ? series.slice(0, j).reduce((a, _, k) => a + (Math.sign(d[k]) === Math.sign(d[j]) ? d[k] : 0), 0) : 0);
        if (horizontal) {
          rects.attr("y", (d) => band(d.i) + (stacked ? 0 : sub(j))).attr("height", stacked ? band.bandwidth() : sub.bandwidth())
            .attr("x", (d) => lin(Math.min(base(d), base(d) + d[j]))).attr("width", (d) => Math.abs(lin(base(d) + d[j]) - lin(base(d))));
        } else {
          rects.attr("x", (d) => band(d.i) + (stacked ? 0 : sub(j))).attr("width", stacked ? band.bandwidth() : sub.bandwidth())
            .attr("y", (d) => lin(Math.max(base(d), base(d) + d[j]))).attr("height", (d) => Math.abs(lin(base(d)) - lin(base(d) + d[j])));
        }
        if (labelsOn && (!stacked || series.length === 1)) {
          g.append("g").selectAll("text").data(data).join("text").attr("font-size", 10).attr("fill", theme.sub)
            .attr("text-anchor", horizontal ? "start" : "middle")
            .attr("x", (d) => (horizontal ? lin(d[j]) + 4 : band(d.i) + (stacked ? band.bandwidth() / 2 : sub(j) + sub.bandwidth() / 2)))
            .attr("y", (d) => (horizontal ? band(d.i) + (stacked ? band.bandwidth() / 2 : sub(j) + sub.bandwidth() / 2) + 3 : lin(d[j]) - 4))
            .text((d) => fmtV(d[j], percent ? yfmt : s.fmt, true));
        }
      });
    } else {
      const curve = f.smooth === false ? d3.curveLinear : d3.curveMonotoneX;
      let cum = data.map(() => 0);
      series.forEach((s, j) => {
        const y0 = cum.slice();
        const y1 = data.map((d, i) => (stacked ? y0[i] + d[j] : d[j]));
        if (stacked) cum = y1;
        const pts = data.map((d, i) => ({ i, y0: y0[i], y1: y1[i], blank: E.isBlank(s.values[i]) }));
        if (v.type !== "line") {
          g.append("path").datum(pts).attr("fill", s.color).attr("opacity", stacked ? 0.75 : 0.22)
            .attr("d", d3.area().curve(curve).x((d) => point(d.i)).y0((d) => lin(stacked ? d.y0 : Math.max(0, minV))).y1((d) => lin(d.y1)));
        }
        g.append("path").datum(pts.filter((p) => !p.blank || stacked)).attr("fill", "none").attr("stroke", s.color).attr("stroke-width", f.lineWidth || 2.4)
          .attr("d", d3.line().curve(curve).x((d) => point(d.i)).y((d) => lin(d.y1)));
        if (f.markers !== false && n <= 60) {
          g.append("g").selectAll("circle").data(pts.filter((p) => !p.blank)).join("circle").attr("cx", (d) => point(d.i)).attr("cy", (d) => lin(d.y1))
            .attr("r", 3.2).attr("fill", theme.card).attr("stroke", s.color).attr("stroke-width", 2).attr("opacity", (d) => selectedOpacity(sel, cats[d.i]));
        }
        if (labelsOn) g.append("g").selectAll("text").data(pts.filter((p) => !p.blank)).join("text").attr("x", (d) => point(d.i)).attr("y", (d) => lin(d.y1) - 7)
          .attr("text-anchor", "middle").attr("font-size", 10).attr("fill", theme.sub).text((d) => fmtV(s.values[d.i], s.fmt, true));
      });
      // hover rail
      const step = n > 1 ? point(1) - point(0) : iw;
      g.append("g").selectAll("rect").data(data).join("rect").attr("x", (d) => point(d.i) - step / 2).attr("width", step).attr("y", 0).attr("height", ih)
        .attr("fill", "transparent").style("cursor", r.catField ? "pointer" : "default")
        .on("mousemove", (ev, d) => showTip(ev, tipRows(d.i))).on("mouseleave", hideTip).on("click", (ev, d) => click(ev, d.i));
    }

    if (lines.length) {
      const lmax = d3.max(lines, (s) => d3.max(s.values, (x) => x || 0)) || 1;
      const lmin = Math.min(0, d3.min(lines, (s) => d3.min(s.values, (x) => x || 0)) || 0);
      const l2 = d3.scaleLinear().domain([lmin, lmax]).nice().range([ih, 0]);
      axisStyle(g.append("g").attr("transform", "translate(" + iw + ",0)").call(d3.axisRight(l2).ticks(Math.max(2, Math.floor(ih / 40))).tickFormat((d) => fmtV(d, lines[0].fmt, true)).tickSize(0).tickPadding(6)), theme);
      g.selectAll(".domain").attr("stroke", "none");
      lines.forEach((s) => {
        const pts = s.values.map((y, i) => ({ i, y })).filter((p) => !E.isBlank(p.y));
        const x = (i) => band(i) + band.bandwidth() / 2;
        g.append("path").datum(pts).attr("fill", "none").attr("stroke", s.color).attr("stroke-width", 2.6).attr("d", d3.line().curve(d3.curveMonotoneX).x((d) => x(d.i)).y((d) => l2(d.y)));
        g.append("g").selectAll("circle").data(pts).join("circle").attr("cx", (d) => x(d.i)).attr("cy", (d) => l2(d.y)).attr("r", 3.5).attr("fill", theme.card).attr("stroke", s.color).attr("stroke-width", 2)
          .on("mousemove", (ev, d) => showTip(ev, tipRows(d.i))).on("mouseleave", hideTip);
        if (labelsOn) g.append("g").selectAll("text").data(pts).join("text").attr("x", (d) => x(d.i)).attr("y", (d) => l2(d.y) - 8).attr("text-anchor", "middle").attr("font-size", 10).attr("fill", s.color).text((d) => fmtV(d.y, s.fmt, true));
      });
    }
    svg.on("click", () => o.onSelect && o.onSelect(null));
  }

  // ------------------------------------------------------------ ribbon (rank) chart
  function renderRibbon(el, v, r, o) {
    const theme = o.theme, W = o.width, H = o.height;
    const svg = makeSvg(el, W, H);
    const colors = colorsFor(v, theme, r.series.length);
    let top = 4 + legend(svg, r.series.map((s, i) => ({ name: s.name, color: colors[i] })), 8, 4, W - 16, theme);
    const m = { l: 10, r: 10, t: top + 6, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b; const n = r.categories.length;
    const g = svg.append("g").attr("transform", "translate(" + m.l + "," + m.t + ")");
    const band = d3.scaleBand().domain(d3.range(n)).range([0, iw]).padding(0.45);
    const totals = r.categories.map((_, i) => r.series.reduce((a, s) => a + Math.max(0, s.values[i] || 0), 0));
    const k = ih / (d3.max(totals) || 1);
    const pos = r.categories.map((_, i) => {
      const order = r.series.map((s, j) => [j, s.values[i] || 0]).sort((a, b) => a[1] - b[1]);
      let y = ih; const out = {};
      order.forEach(([j, val]) => { const hgt = Math.max(0, val) * k; out[j] = { y0: y - hgt, y1: y }; y -= hgt; });
      return out;
    });
    r.series.forEach((s, j) => {
      for (let i = 0; i < n; i++) {
        const p = pos[i][j]; const x = band(i);
        g.append("rect").attr("x", x).attr("width", band.bandwidth()).attr("y", p.y0).attr("height", p.y1 - p.y0).attr("fill", colors[j])
          .on("mousemove", (ev) => showTip(ev, [[r.catLabel, catText(r.categories[i])], [s.name, fmtV(s.values[i], s.fmt), colors[j]]])).on("mouseleave", hideTip);
        if (i < n - 1) {
          const q = pos[i + 1][j]; const x1 = x + band.bandwidth(), x2 = band(i + 1);

    slicerFilters(page, exceptId) {
      const out = [];
      const pages = this.report.syncSlicers ? this.report.pages : [page];
      for (const pg of pages) for (const v of pg.visuals) {
        if (v.type !== "slicer" || v.id === exceptId || !v.state) continue;
        if (pg !== page && !(v.format && v.format.sync)) continue;
        const f = (v.fields.category || [])[0]; if (!f) continue;
        if (v.state.values && v.state.values.length) out.push(E.inFilter(f.table, f.column, v.state.values, f.level));
        if (v.state.range && (v.state.range.min != null || v.state.range.max != null)) out.push(E.filterFromSpec({ field: f, mode: "range", min: v.state.range.min, max: v.state.range.max }));
      }
      return out.filter(Boolean);
    }

    filtersFor(v, page) {
      page = page || this.page;
      let fs = this.specFilters(this.report.reportFilters).concat(this.specFilters(page.filters)).concat(this.slicerFilters(page, v.id));
      const sel = this.selection;
      if (sel && sel.visualId !== v.id && sel.page === page.id && sel.values.size && !(v.format && v.format.ignoreCrossFilter)) {
        fs.push(E.inFilter(sel.field.table, sel.field.column, Array.from(sel.values), sel.field.level));
      }
      fs = fs.concat(this.specFilters(v.filters));
      return fs;
    }

    queryVisual(v, page) {
      if (v.type === "textbox" || v.type === "image") return null;
      const filters = this.filtersFor(v, page);
      if (v.type === "slicer") v._slicerFilters = this.specFilters(this.report.reportFilters).concat(this.specFilters((page || this.page).filters)).concat(this.slicerFilters(page || this.page, v.id));
      const missing = [];
      for (const list of Object.values(v.fields || {})) for (const f of list || []) if (f && f.table && !this.model.tables[f.table] && !missing.includes(f.table)) missing.push(f.table);
      if (missing.length) return { empty: false, errors: ["No data loaded for table " + missing.map((t) => "'" + t + "'").join(", ")] };
      try { return E.query(this.model, v, filters, this.report); }
      catch (e) { console.error(e); return { empty: false, errors: [e.message] }; }
    }

    // ------------------------------------------------------------ rendering
    render() {
      const page = this.page; const theme = this.theme; const { w, h } = this.pageSize();
      const c = this.canvas;
      c.style.width = w + "px"; c.style.height = h + "px";
      c.style.background = page.background || theme.page;
      if (page.wallpaper) c.style.backgroundImage = "url(" + page.wallpaper + ")";
      c.innerHTML = "";
      c.classList.toggle("dark", theme.name.includes("dark"));
      this.frames = {};
      const visuals = page.visuals.slice().sort((a, b) => (a.z || 0) - (b.z || 0));
      for (const v of visuals) this.renderVisual(v);
      if (this.hooks.afterRender) this.hooks.afterRender();
    }

    renderVisual(v) {
      const theme = this.theme; const f = v.format || {};
      let frame = this.frames && this.frames[v.id];
      if (!frame) {
        frame = document.createElement("div");
        frame.className = "visual t-" + v.type;
        frame.dataset.id = v.id;
        this.canvas.appendChild(frame);
        this.frames[v.id] = frame;
        if (this.hooks.decorate) this.hooks.decorate(frame, v);
      }
      if (v.hidden && !this.editable) { frame.style.display = "none"; return; }
      Object.assign(frame.style, {
        left: v.x + "px", top: v.y + "px", width: v.w + "px", height: v.h + "px",
        background: f.background === "transparent" ? "transparent" : f.background || theme.card,
        borderRadius: (f.radius ?? 6) + "px",
        border: f.border ? "1px solid " + (f.borderColor || theme.grid) : "1px solid transparent",
        boxShadow: f.shadow === false || f.background === "transparent" ? "none" : "",
        zIndex: v.z || 0,
        opacity: v.hidden ? 0.4 : 1,
      });
      let head = frame.querySelector(":scope > .vhead");
      let body = frame.querySelector(":scope > .vbody");
      if (!head) { head = document.createElement("div"); head.className = "vhead"; frame.appendChild(head); }
      if (!body) { body = document.createElement("div"); body.className = "vbody"; frame.appendChild(body); }
      const showTitle = v.title && f.showTitle !== false && v.type !== "textbox";
      head.style.display = showTitle ? "" : "none";
      head.innerHTML = showTitle ? '<span style="font-size:' + (f.titleSize || 13) + "px;color:" + (f.titleColor || theme.text) + ";text-align:" + (f.titleAlign || "left") + '">' + V.esc(v.title) + "</span>" : "";
      if (!this.editable) {
        const tools = document.createElement("div"); tools.className = "vtools";
        tools.innerHTML = '<button title="Focus mode" data-act="focus">⤢</button>' + (["table", "matrix"].includes(v.type) || v.fields && v.fields.category ? '<button title="Export data (CSV)" data-act="csv">⇩</button>' : "");
        head.appendChild(tools);
        tools.addEventListener("click", (ev) => { const a = ev.target.dataset.act; if (a === "focus") this.focus(v); if (a === "csv") this.exportData(v); });
      }
      const headH = v.type === "slicer" ? 24 : 34;
      const bw = v.w - (v.type === "textbox" || v.type === "image" ? 8 : 16), bh = v.h - (showTitle ? headH : 8) - 8;
      body.style.height = bh + "px";
      const result = this.queryVisual(v);
      this.results[v.id] = result;
      const sel = this.selection && this.selection.visualId === v.id ? this.selection.values : null;
      V.render(body, v, result, {
        width: Math.max(20, bw), height: Math.max(20, bh), theme, selection: sel,
        onSelect: (val, additive) => this.select(v, val, additive),
        slicerValues: v.state && v.state.values, slicerRange: v.state && v.state.range,
        onSlicer: (vals) => { v.state = Object.assign({}, v.state, { values: vals }); this.changed(true); },
        onSlicerRange: (rng) => { v.state = Object.assign({}, v.state, { range: rng }); this.changed(true); },
        onFormat: (patch) => { v.format = Object.assign({}, v.format, patch); this.changed(true); },
        expanded: (this.expanded[v.id] = this.expanded[v.id] || {}),
        onExpand: () => this.renderVisual(v),
      });
    }

    select(v, val, additive) {
      const field = v.type === "table" ? (v.fields.columns || [])[0] : v.type === "matrix" ? (v.fields.rows || [])[0] : (v.fields.category || [])[0];
      if (val === null || val === undefined || !field || E.isValueField(field)) {
        if (this.selection) { this.selection = null; this.renderAllButSlicersFocus(); }
        return;
      }
      if (this.editable && this.hooks.selectVisual) this.hooks.selectVisual(v.id, true);
      let values = this.selection && this.selection.visualId === v.id ? new Set(this.selection.values) : new Set();
      if (additive) values.has(val) ? values.delete(val) : values.add(val);
      else values = values.size === 1 && values.has(val) ? new Set() : new Set([val]);
      this.selection = values.size ? { visualId: v.id, field, values, page: this.page.id } : null;
      this.renderAllButSlicersFocus();
    }

    clearSelection() { if (this.selection) { this.selection = null; this.renderAllButSlicersFocus(); } }

    renderAllButSlicersFocus() {
      const active = document.activeElement;
      for (const v of this.page.visuals) {
        // keep slicer search boxes usable while typing
        if (v.type === "slicer" && this.frames[v.id] && this.frames[v.id].contains(active)) continue;
        this.renderVisual(v);
      }
    }

    changed(persist) {
      this.renderAllButSlicersFocus();
      if (persist && this.hooks.changed) this.hooks.changed("slicer");
    }

    resetFilters() {
      for (const p of this.report.pages) for (const v of p.visuals) if (v.type === "slicer") v.state = {};
      this.selection = null;
      this.render();
      if (this.hooks.changed) this.hooks.changed("slicer");
    }

    // ------------------------------------------------------------ focus mode & data export
    focus(v) {
      const ov = document.createElement("div"); ov.className = "focus-overlay";
      ov.innerHTML = '<div class="focus-box"><div class="focus-head"><b>' + V.esc(v.title || V.TYPES[v.type].label) + '</b><button>✕ Back to report</button></div><div class="focus-body"></div></div>';
      document.body.appendChild(ov);
      const body = ov.querySelector(".focus-body");
      const draw = () => {
        const r = body.getBoundingClientRect();
        V.render(body, v, this.queryVisual(v), { width: r.width - 10, height: r.height - 10, theme: this.theme, expanded: {}, onExpand: draw });
      };
      requestAnimationFrame(draw);
      ov.querySelector("button").onclick = () => ov.remove();
      ov.addEventListener("click", (e) => { if (e.target === ov) ov.remove(); });
    }

    exportData(v) {
      const r = this.results[v.id]; if (!r) return;
      let header = [], rows = [];
      if (r.columns) { header = r.columns.map((c) => c.label); rows = r.rows; }
      else if (r.categories) { header = [r.catLabel || "Category"].concat(r.series.concat(r.lines || []).map((s) => s.name)); rows = r.categories.map((c, i) => [c].concat(r.series.concat(r.lines || []).map((s) => s.values[i]))); }
      else if (r.points) { header = [r.catLabel, r.xLabel, r.yLabel]; rows = r.points.map((p) => [p.label, p.x, p.y]); }
      else if (r.rows && r.measures) { header = [r.rowLabel, "Total"]; rows = r.rows.map((x) => [x.label].concat(x.total)); }
      const csv = [header].concat(rows).map((row) => row.map((x) => { const s = x == null ? "" : String(x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n");
      V.download((v.title || v.type) + ".csv", URL.createObjectURL(new Blob([csv], { type: "text/csv" })));
    }

    // ------------------------------------------------------------ export
    async pagePNG(index, scale) {
      const prev = this.pageIndex; const prevSel = this.selection;
      if (index != null && index !== this.pageIndex) { this.pageIndex = index; this.selection = null; this.render(); await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))); }
      const page = this.page; const { w, h } = this.pageSize();
      const items = page.visuals.filter((v) => !v.hidden).slice().sort((a, b) => (a.z || 0) - (b.z || 0)).map((v) => ({ visual: v, result: this.results[v.id], el: this.frames[v.id] && this.frames[v.id].querySelector(".vbody") }));
      const svg = V.pageSVG(page, items, this.theme, w, h);
      const png = await V.svgToPNG(svg, w, h, scale || 2);
      if (index != null && prev !== index) { this.pageIndex = prev; this.selection = prevSel; this.render(); }
      return { name: page.name, png, width: w, height: h, svg };
    }

    async allPagesPNG(scale) {
      const out = [];
      for (let i = 0; i < this.report.pages.length; i++) out.push(await this.pagePNG(i, scale));
      return out;
    }
  }

  global.PyBIRuntime = Runtime;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* PyBI viewer: read-only interactive dashboards for the network link and exported HTML files. */
(function () {
  "use strict";
  const V = window.PyBIVisuals;
  const $ = (id) => document.getElementById(id);
  let rt = null, revision = -1;

  function fit() {
    if (!rt) return;
    const stage = $("vstage"); const { w, h } = rt.pageSize();
    const z = Math.min((stage.clientWidth - 40) / w, 2.5);
    const c = $("vcanvas");
    c.style.transform = "scale(" + z + ")"; c.style.transformOrigin = "top left";
    c.parentElement.style.minHeight = h * z + 30 + "px";
    c.style.marginLeft = Math.max(0, (stage.clientWidth - w * z) / 2) + "px";
  }

  function tabs() {
    const nav = $("vpages"); nav.innerHTML = "";
    rt.report.pages.forEach((p, i) => {
      if (p.hidden) return;
      const b = document.createElement("button"); b.textContent = p.name; b.className = i === rt.pageIndex ? "on" : "";
      b.onclick = () => { rt.pageIndex = i; rt.selection = null; rt.render(); tabs(); fit(); location.hash = "page=" + i; };
      nav.appendChild(b);
    });
  }

  function load(data, keepPage) {
    const page = keepPage && rt ? rt.pageIndex : (parseInt((location.hash.match(/page=(\d+)/) || [])[1]) || 0);
    // keep viewer-side slicer selections when the live report refreshes
    const states = {};
    if (rt) for (const p of rt.report.pages) for (const v of p.visuals) if (v.state) states[v.id] = v.state;
    rt = new window.PyBIRuntime({ report: data.report, tables: data.tables, canvas: $("vcanvas"), editable: false, hooks: {} });
    if (keepPage) for (const p of rt.report.pages) for (const v of p.visuals) if (states[v.id]) v.state = states[v.id];
    rt.pageIndex = Math.min(page, rt.report.pages.length - 1);
    document.title = data.report.title || "PyBI report";
    $("vtitle").textContent = data.report.title || "PyBI report";
    const ver = data.app && data.app.version; if (ver && $("vver")) $("vver").textContent = "v" + ver;
    if (data.exportedAt) $("vstamp").textContent = "· exported " + data.exportedAt.replace("T", " ");
    rt.render(); tabs(); fit();
  }

  async function poll() {
    try {
      const r = await fetch("/api/revision", { cache: "no-store" }); const j = await r.json();
      if (j.revision !== revision) { revision = j.revision; const s = await (await fetch("/api/view-state", { cache: "no-store" })).json(); load(s, true); }
    } catch (e) { /* server stopped: keep showing last state */ }
    setTimeout(poll, 4000);
  }

  $("vreset").onclick = () => rt && rt.resetFilters();
  $("vpng").onclick = async () => { const p = await rt.pagePNG(null, 2); V.download((rt.report.title || "report") + " - " + p.name + ".png", p.png); };
  $("vfull").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  $("vcanvas").addEventListener("click", (e) => { if (e.target.id === "vcanvas") rt.clearSelection(); });
  document.addEventListener("click", () => document.querySelectorAll(".ddmenu.open").forEach((m) => m.classList.remove("open")));
  window.addEventListener("resize", fit);

  if (window.PYBI_EMBED) load(window.PYBI_EMBED);
  else { $("vlive").style.display = ""; poll(); }
})();

</script>
</body>
